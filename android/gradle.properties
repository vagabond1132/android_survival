# Project-level Gradle properties
# 项目级 Gradle 配置 (会被 android-build/ 复制时一起带过去)

# === JVM 编码 (避免 Windows/容器 locale 非 UTF-8 导致中文乱码) ===
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx2048m -XX:MaxMetaspaceSize=512m

# === Gradle 性能 ===
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# === AndroidX ===
android.useAndroidX=true
android.enableJetifier=false

# === Kotlin (如果将来用) ===
kotlin.code.style=official

# === AGP 警告抑制 ===
# AGP 8.x 在 compileSdk=34 时会警告 "tested up to compileSdk = 33", 抑制掉
android.suppressUnsupportedCompileSdk=34

# === 原生库不压缩 (AGP 8.1+ 移除 enableUncompressedNativeLibs, 改用 useLegacyPackaging) ===
# 注意: 不要设 android.bundle.enableUncompressedNativeLibs, AGP 8.4 会报弃用错
